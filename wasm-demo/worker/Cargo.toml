# WASM module for the Cloudflare Worker + R2 streaming demo.
#
# The Worker passes in a JS `read_range(offset, length) -> Promise<Uint8Array>`
# callback backed by an R2 range `get`; this module wraps it as an
# `AsyncRangeReader` and runs `search_payloads_async` over the serialized index.
# Single-threaded isolate, so the crate's `!Send` async futures fit natively.
#
# Standalone, excluded from the published crate via root `exclude=["/wasm-demo/"]`.
[package]
name = "psi_worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.99"
# `async` implies `stream`; no parallel/simd (single-threaded isolate, read-only).
packed_spatial_index = { path = "../..", default-features = false, features = ["async"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# `opt-level = "s"` was the default choice here and it is the wrong one for a
# module whose work is tree traversal: at the size levels there is no
# autovectorization, which is what the crate's collect paths are built around.
# Measured on wasm32 (same source, 1000 count queries over 100 000 boxes),
# `"s"` without SIMD against `3` with it: 664.1 -> 325.3 us wide (2.0x) and
# 362.5 -> 195.8 us narrow (1.9x), for 9.8% more module (523 KB -> 574 KB raw,
# well inside a Worker's size limit). `"z"` is both bigger and slower than
# `"s"` here, so it is never the answer.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true

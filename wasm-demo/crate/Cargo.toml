[package]
name = "packed_spatial_index_wasm_demo"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for the packed_spatial_index browser demo"
repository = "https://github.com/Filyus/packed_spatial_index"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
js-sys = "0.3.99"
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = ["Performance", "Window"] }
packed_spatial_index = { path = "../..", default-features = false }

[features]
default = ["simd"]
simd = ["packed_spatial_index/simd"]

# Measured on wasm32 (same source, `+simd128` on, 1000 count queries over
# 100 000 boxes): adding these two takes the module from 142 841 to 123 193
# bytes and the query from 344.8 to 325.3 us wide, 216.4 to 195.8 us narrow.
# Smaller and faster both, which is why there is nothing to trade off here.
[profile.release]
lto = true
codegen-units = 1

name: "Pages: deploy WASM demo"
run-name: "pages: deploy WASM demo"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "src/**"
      - "wasm-demo/**"
      - "Cargo.toml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wasm-demo/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build WASM demo
        working-directory: wasm-demo
        run: |
          # `wasm-pack`'s npm package fetches its binary from GitHub releases in a
          # postinstall step, and that fetch has been hanging up mid-transfer often
          # enough to fail four runs in a row while GitHub reported no incident.
          # Only the install is retried: a compile or test failure must still fail
          # on the first try, and three exhausted attempts still fail the job.
          for attempt in 1 2 3; do
            npm ci && installed=yes && break
            echo "npm ci failed (attempt $attempt of 3); retrying" >&2
            rm -rf node_modules
            sleep 15
          done
          [ -n "${installed:-}" ] || { echo "npm ci failed three times" >&2; exit 1; }
          npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: wasm-demo/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
